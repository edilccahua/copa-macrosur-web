[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[project]
name = "kuspide-mtb"
version = "1.0.0"
description = "Plataforma oficial de cronometraje y ranking para campeonato MTB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "openpyxl>=3.1.5",
    "gpxpy>=1.6.2",
    "boto3>=1.35.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "pypdf>=5.0.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
